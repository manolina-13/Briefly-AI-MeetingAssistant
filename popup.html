<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Muse</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Meeting Muse <span class="sparkle">✨</span></h1>
      <p class="subtitle">AI-Powered Summaries</p>
    </header>

    <section class="settings-card">
      <label for="apiKey">Gemini API Key</label>
      <div class="input-group">
        <input type="password" id="apiKey" placeholder="Enter your API key..." />
        <button id="saveBtn" class="btn-primary">Save</button>
      </div>
      <div class="api-help">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">
          Need a key? Get one for free here ↗
        </a>
      </div>
      <p id="statusMsg" class="status hidden">Saved successfully!</p>
    </section>

    <section class="summaries-section">
      <div class="section-header">
        <h2>Recent Meetings</h2>
        <button id="clearBtn" class="btn-text">Clear All</button>
      </div>
      <div id="summariesList" class="summaries-list">
        <!-- Summaries will be injected here -->
        <div class="empty-state">
          <p>No meetings recorded yet.</p>
        </div>
      </div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
